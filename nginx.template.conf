worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include $!{nginx}/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    server {
        listen ${PORT};
        server_name _;
        root /app/public;
        index index.php index.html;

        # Instant Railway healthcheck endpoint
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # Direct serving for static assets with fallback to Laravel
        location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|ttf|woff|woff2|eot|otf)$ {
            try_files $uri $uri/ /index.php?$query_string;
            expires 30d;
            access_log off;
        }

        # Laravel main routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM FastCGI processing
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_read_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
